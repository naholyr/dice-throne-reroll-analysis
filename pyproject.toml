[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicethrone-helper"
version = "0.1.0"
description = "Calculateur exact d'aide à la relance pour Dice Throne"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dicethrone-helper = "dicethrone_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dicethrone_helper = ["fonts/*.woff2", "fonts/*.txt"]
